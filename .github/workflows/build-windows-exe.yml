name: Build Windows exe

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install openpyxl pyxlsb reportlab holidays
          pip install .
          pip install pyinstaller

      - name: Empacotar com PyInstaller (app nativo Tkinter)
        run: >
          pyinstaller --onefile --name livroponto --noconfirm
          --collect-submodules livroponto
          --add-data "livroponto;livroponto"
          windows_launcher_desktop.py

      - name: "Smoke test: módulos empacotados importam"
        run: .\dist\livroponto.exe --check

      - name: "Smoke test: a janela abre e o processo não crasha"
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\livroponto.exe" `
            -NoNewWindow -PassThru `
            -RedirectStandardOutput "exe_stdout.log" `
            -RedirectStandardError "exe_stderr.log"
          Start-Sleep -Seconds 8
          $rodando = -not $proc.HasExited
          Write-Host "----- stdout do .exe -----"
          Get-Content "exe_stdout.log" -ErrorAction SilentlyContinue
          Write-Host "----- stderr do .exe -----"
          Get-Content "exe_stderr.log" -ErrorAction SilentlyContinue
          if ($proc.HasExited) {
            throw "o .exe encerrou sozinho (exit code $($proc.ExitCode)) em vez de manter a janela aberta"
          }
          Write-Host "OK: processo continua rodando (janela aberta) apos 8s"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: livroponto-windows-exe
          path: dist/livroponto.exe
          retention-days: 14
